# Blueprint de Render: https://render.com/docs/blueprint-spec
# Una sola instancia: las salas de amigos viven en la memoria del servidor.
services:
  - type: web
    name: decido-yo
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
